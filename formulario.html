<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI | INSCRIÇÃO</title>
</head>

<body>
    <table align="center" border="0" width="900">
        <!--HEAD-->
        <thead>
            <tr>
                <th align="center">
                    <img src="img/senai-165.png" alt="" height="80" align="center">
                    <a href="index.html"><strong>HOME</strong></a>
                    <a href="#quem_somos"><strong>QUEM SOMOS</strong></a>
                    <a href="#contatos"><strong>CONTATOS</strong></a>
                    <a href="#login"><strong>LOGIN</strong>
                        <a href="formulario.html"><strong>INSCRIÇÃO</strong></a>
                </th>
            </tr>
        </thead>
        <!--BODY-->
        <tr>
            <td>
                <form action="#NomeArquivoBACKEND" method="post" enctype="multipart/form-data">
                    <fieldset>
                        <legend>
                            <h2>Dados Pessoais</h2>
                        </legend>
                        <label for="nome">Nome Completo</label><br>
                        <input type="text" id="nome" name="nome" min="4" placeholder="Insira seu nome completo."
                            required>

                        <br><br>

                        <label for="cpf">CPF
                        </label><br>
                        <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                            placeholder="000.000.000-00" required>

                        <br><br>

                        <label for="nascimento">Data de Nascimento</label><br>
                        <input type="date" id="nascimento" name="nascimento" required>

                        <br><br>

                        <label for="sexo">Sexo</label><br>
                        <select name="sexo" id="sexo" required>
                            <option value="">Selecione seu gênero</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="naoinformou">Prefiro não informar</option>
                        </select>

                        <br><br>

                        <label for="nomemae">Nome da Mãe</label><br>
                        <input type="text" id="nomemae" name="nomemae" placeholder="Digite o nome de sua mãe." required>

                        <br><br>

                        <label for="nomepai">Nome do Pai (Opcional)</label><br>
                        <input type="text" id="nomepai" name="nomepai" placeholder="Digite o nome de seu pai.">

                        <br><br>

                        <label for="estadocivil">Estado Civil</label><br>
                        <input type="radio" name="estadocivil" id="estadocivil" value="solteiro" required>
                        <label for="solteiro">Solteiro</label>

                        <input type="radio" name="estadocivil" id="estadocivil" value="casado" required>
                        <label for="casado">Casado</label>

                        <input type="radio" name="estadocivil" id="estadocivil" value="uniao" required>
                        <label for="uniao">União Estável</label>

                        <input type="radio" name="estadocivil" id="estadocivil" value="divorcio" required>
                        <label for="divorcio">Divorciado(a)</label>

                        <input type="radio" name="estadocivil" id="estadocivil" value="viuvo" required>
                        <label for="viuvo">Viuvo(a)</label>

                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>
                            <h2>Dados de Contato</h2>
                        </legend>
                        <label for="email">E-mail</label><br>
                        <input type="email" name="email" id="email" placeholder="exemplo@email.com" required>

                        <br><br>

                        <label for="telefone">Número de Telefone</label><br>
                        <input type="tel" name="telefone" id="telefone" pattern="+55 ([1-9]{2})"
                            placeholder="+55 (99) 9 9999-9999" required>

                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>Endereço</legend>
                        <label for="">CEP</label><br>
                        <input type="text" name="cep" id="cep" required>

                        <br><br>

                        <label for="estado">Estado</label><br>
                        <input type="text" name="estado" id="estado" required>

                        <br><br>

                        <label for="bairro">Bairro</label><br>
                        <input type="text" name="bairro" id="bairro" required>

                        <br><br>

                        <label for="numero">Número</label><br>
                        <input type="text" name="numero" id="numero" required>

                        <br><br>

                        <label for="complemento">Complemento (Opcional)</label><br>
                        <input type="text" name="complemento" id="complemento">

                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>Informações Acadêmicas</legend>
                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>Informações Adicionais</legend>
                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>Envio de Documentos</legend>
                        <br><br>
                    </fieldset>
                    <fieldset>
                        <legend>Termos e Declarações</legend>
                        <br><br>
                    </fieldset>
                    <br><br>

                    <div align="center">
                        <button type="submit">Enviar Matrícula</button>
                        <button type="reset">Limpar Formulário</button>
                        <br><br>
                    </div>
                </form>
            </td>
        </tr>
        <!--RODAPÉ-->
        <tfoot>
            <td colspan="2" align="center">
                <h1>FAÇA PARTE DO NOSSO TIME!</h1>
                <form action="">
                    <input type="submit" value="CLIQUE AQUI E INSCREVA-SE AGORA">
                </form>
                <h2>&copy; SENAI</h2>
                <h2>Todos os direitos reservados.</h2>
            </td>
        </tfoot>
    </table>
</body>

</html>
